name: Workflow lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
          install_args: --locked packslip:github.com/jdx/jactionlint aqua:koalaman/shellcheck
      - uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          executable: jactionlint
          annotations: true
          min-severity: warn
          strict-exit: true
          online: true

  sarif:
    name: Upload workflow findings
    if: ${{ vars.ENABLE_CODE_SCANNING == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
          install_args: --locked packslip:github.com/jdx/jactionlint aqua:koalaman/shellcheck
      - uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          executable: jactionlint
          advanced-security: true
          online: true
