name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# no build: it prerenders through the remote IMAGES binding, which needs the
# Cloudflare token, and pull requests get no secrets
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node (package.json devEngines), aube and hk (mise.toml)
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - run: aube install --frozen-lockfile
      - run: aube run --no-install check
      - run: aube exec --no-install biome ci .
