name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the build needs no Cloudflare credentials, so pull requests build without secrets
jobs:
  workflow-lint:
    name: Workflow checks
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/workflow-lint.yml

  check:
    name: Check and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.12'
          install_args: --locked

      - run: aube install --frozen-lockfile
      - run: aube run --no-install check
      - run: aube exec --no-install biome ci .
      - run: aube exec --no-install cf build
        env:
          CF_SEND_TELEMETRY: "false"
