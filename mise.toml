[tools]
node = "26.13.1"
"packslip:github.com/aubepkg/aube" = "2.10.1"
"packslip:github.com/jdx/hk" = "2.13.0"

[hooks]
# skipped in CI, where the workflows install with a frozen lockfile and need no git hooks
postinstall = '[ -n "$CI" ] || { aube install && hk install --mise; }'

[settings]
experimental = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
